function log(msg, type='info') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${type}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

function setStatus(msg, type='running') {
  document.getElementById('status-wrap').innerHTML = `<div class="status ${type}">${msg}</div>`;
}

window.initEmployees = async function() {
  setStatus('⏳ 初始化員工清冊中...', 'running');
  log('開始寫入員工資料...', 'info');
  try {
    const BATCH_SIZE = 500;
    let count = 0;
    for(let i = 0; i < EMPLOYEES.length; i += BATCH_SIZE) {
      const batch = writeBatch(db);
      const chunk = EMPLOYEES.slice(i, i + BATCH_SIZE);
      chunk.forEach(([id, name]) => {
        const ref = doc(db, 'summer2026_employees', id);
        batch.set(ref, {
          empId: id, name,
          group: '', charId: '', nickname: '',
          taskPts: 0, inbodyPts: 0, rankPts: 0,
          totalPts: 0, letters: [],
          target: '', targetVal: 0, currentGap: 0,
          consecutiveDays: 0, jellyCount: 0,
          registeredAt: null, createdAt: new Date()
        });
        count++;
      });
      await batch.commit();
      log(`已寫入 ${count} / ${EMPLOYEES.length} 位員工`, 'ok');
    }
    setStatus(`✅ 完成！共寫入 ${EMPLOYEES.length} 位員工`, 'done');
    log(`✅ 員工清冊初始化完成`, 'ok');
  } catch(e) {
    setStatus('❌ 發生錯誤：' + e.message, 'error');
    log('❌ ' + e.message, 'err');
  }
};

window.initSettings = async function() {

window.clearAll = async function() {
  if(!confirm('⚠️ 確定要清除所有活動資料嗎？此操作無法復原！')) return;
  if(!confirm('再次確認：真的要清除所有資料嗎？')) return;
  setStatus('⏳ 清除中...', 'running');
  const cols = ['summer2026_employees','summer2026_checkins','summer2026_settings','summer2026_letters'];
  try {
    for(const col of cols) {
      const snap = await getDocs(collection(db, col));
      const batch = writeBatch(db);
      snap.docs.forEach(d => batch.delete(d.ref));
      await batch.commit();
      log(`已清除 ${col}`, 'ok');
    }
    setStatus('✅ 清除完成', 'done');
  } catch(e) {
    setStatus('❌ ' + e.message, 'error');
    log('❌ ' + e.message, 'err');
  }
};
